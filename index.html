<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fbf4ee">
<title>Aarushi — Happy Birthday</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap');
:root{--cream:#fbf4ee;--paper:#fffaf6;--ink:#2d2927;--muted:#746b67;--rose:#c87978;--rose-dark:#9d5659;--peach:#f1c7b8;--line:#eadbd2}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#9f8f87 .55px,transparent .55px);background-size:7px 7px;z-index:20}
a{text-decoration:none;color:inherit}button{font:inherit}
.nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(255,250,246,.8);backdrop-filter:blur(14px);border:1px solid rgba(234,219,210,.9);border-radius:999px;padding:9px 14px;display:flex;gap:8px;box-shadow:0 12px 35px rgba(60,35,25,.08)}
.nav a{font-size:12px;padding:8px 12px;border-radius:999px;color:var(--muted)}.nav a:hover{background:#f3e4dc;color:var(--ink)}
.hero{min-height:100vh;display:grid;place-items:center;padding:90px 22px 60px;position:relative;overflow:hidden}.blob{position:absolute;border-radius:50%;filter:blur(3px);opacity:.48}.b1{width:420px;height:420px;background:#f2cfc0;top:-170px;right:-120px}.b2{width:320px;height:320px;background:#e5d4ed;bottom:-160px;left:-130px}
.hero-inner{width:min(1100px,100%);display:grid;grid-template-columns:1.02fr .98fr;gap:65px;align-items:center}.eyebrow,.kicker{letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--rose-dark);font-weight:600;margin-bottom:18px}
h1{font:600 clamp(54px,8vw,104px)/.92 "Playfair Display",serif;margin:0 0 22px;letter-spacing:-.045em}h1 em{font-weight:500;color:var(--rose-dark)}
.lede{font-size:17px;line-height:1.8;color:var(--muted);max-width:550px}.cta{display:inline-flex;gap:10px;margin-top:25px;background:var(--ink);color:#fff;padding:13px 18px;border-radius:999px;font-size:13px}
.hero-photo{position:relative;max-width:500px;justify-self:end}.hero-photo img{width:100%;display:block;border-radius:24px;box-shadow:25px 30px 70px rgba(56,31,22,.18);transform:rotate(2deg)}
.tape{position:absolute;width:105px;height:30px;background:rgba(246,220,196,.82);top:-15px;left:42%;transform:rotate(-5deg);z-index:2}.caption{position:absolute;bottom:-22px;left:-25px;background:var(--paper);padding:16px 20px;border:1px solid var(--line);box-shadow:0 15px 35px rgba(56,31,22,.09);transform:rotate(-3deg);font:italic 17px "Playfair Display",serif}
.section{padding:105px 22px}.wrap{width:min(1100px,100%);margin:auto}.center{text-align:center}.section-intro{max-width:610px;margin:0 auto 45px;color:var(--muted);line-height:1.8}
.letter{display:grid;grid-template-columns:.85fr 1.15fr;gap:50px;align-items:stretch}.letter-card{background:var(--paper);padding:48px;border:1px solid var(--line);box-shadow:0 20px 55px rgba(56,31,22,.08);position:relative}.letter-card:after{content:"";position:absolute;inset:12px;border:1px solid #f0dfd6;pointer-events:none}.letter-card>*{position:relative;z-index:1}.quote{font:italic 30px/1.35 "Playfair Display",serif;color:var(--rose-dark)}.letter-text{font-size:15px;line-height:2;color:#625956}.signature{font:italic 26px "Playfair Display",serif;margin-top:28px}
.polaroid{background:white;padding:12px 12px 48px;box-shadow:0 18px 40px rgba(56,31,22,.12);transform:rotate(-3deg);align-self:center}.polaroid img{width:100%;height:100%;max-height:500px;object-fit:cover}.polaroid .small{font:italic 18px "Playfair Display",serif;text-align:center;padding-top:14px}
.timeline{position:relative;max-width:920px;margin:55px auto 0}.timeline:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}.event{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;margin:0 0 65px}.event:nth-child(even) .event-photo{grid-column:2;grid-row:1}.event:nth-child(even) .event-copy{grid-column:1;grid-row:1;text-align:right}.event-copy{padding:10px 5px}.event-date{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose-dark);font-weight:600}.event h3{font:600 34px "Playfair Display",serif;margin:10px 0}.event p{line-height:1.8;color:var(--muted);font-size:14px}.event-photo{background:#fff;padding:9px;box-shadow:0 15px 35px rgba(56,31,22,.1);transform:rotate(-2deg)}.event:nth-child(even) .event-photo{transform:rotate(2deg)}.event-photo img{width:100%;height:330px;object-fit:cover;display:block}
.gallery{columns:3 260px;column-gap:18px}.card{break-inside:avoid;margin:0 0 18px;background:white;padding:9px;box-shadow:0 12px 30px rgba(56,31,22,.08);border:1px solid #eee2db;cursor:pointer;transition:.35s}.card:hover{transform:translateY(-5px) rotate(.5deg);box-shadow:0 20px 45px rgba(56,31,22,.14)}.card img{width:100%;display:block;max-height:620px;object-fit:cover}.card .caption2{padding:13px 8px 8px;font:italic 17px "Playfair Display",serif;color:#5c514d}
.note-section{background:#2f2a29;color:#fff8f4;position:relative;overflow:hidden}.note-section:before{content:"";position:absolute;width:500px;height:500px;border-radius:50%;background:#8e4f57;filter:blur(100px);opacity:.28;right:-150px;top:-220px}.note{max-width:760px;margin:auto;text-align:center;position:relative;z-index:1}.note h2{color:#fff8f4}.note p{font:italic 25px/1.65 "Playfair Display",serif;color:#f3dfd8}.surprise{margin-top:24px;background:#fff8f4;color:#2f2a29;border:0;border-radius:999px;padding:14px 22px;cursor:pointer}
.footer{padding:70px 22px 90px;text-align:center}.footer .heart{font-size:28px}.footer p{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.modal{position:fixed;inset:0;background:rgba(26,19,17,.7);backdrop-filter:blur(8px);display:none;place-items:center;padding:22px;z-index:100}.modal.show{display:grid}.modal-box{max-width:650px;background:var(--paper);padding:45px;border-radius:22px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.3);position:relative}.modal-box h3{font:600 44px "Playfair Display",serif;margin:0 0 15px}.modal-box p{line-height:1.9;color:var(--muted)}.close{position:absolute;right:16px;top:12px;border:0;background:none;font-size:24px;color:var(--muted);cursor:pointer}
.float-heart{position:fixed;bottom:-30px;font-size:20px;pointer-events:none;z-index:50;animation:rise 5s linear forwards}@keyframes rise{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media(max-width:800px){.nav{width:max-content;max-width:94%;overflow:auto}.hero-inner,.letter,.event{grid-template-columns:1fr;gap:35px}.hero-photo{justify-self:center;max-width:520px}.caption{left:8px}.section{padding:80px 18px}.letter-card{padding:32px}.note p{font-size:21px}.timeline:before{left:8px}.event,.event:nth-child(even){display:grid;grid-template-columns:1fr;margin-left:22px}.event:nth-child(even) .event-copy,.event:nth-child(even) .event-photo{grid-column:auto;grid-row:auto;text-align:left}.event-photo img{height:280px}}
</style>
</head>
<body>
<nav class="nav"><a href="#home">Home</a><a href="#letter">For You</a><a href="#story">Our Story</a><a href="#memories">Memories</a><a href="#surprise">Surprise</a></nav>

<section class="hero" id="home"><div class="blob b1"></div><div class="blob b2"></div>
<div class="hero-inner"><div>
<div class="eyebrow" id="heroEyebrow"></div><h1><span id="heroTitle"></span><br><em id="heroName"></em></h1>
<p class="lede" id="heroIntro"></p><a class="cta" href="#letter" id="heroButton"></a></div>
<div class="hero-photo"><div class="tape"></div><img id="heroImage" src="assets/memory-01.jpeg" alt="Aarushi"><div class="caption" id="heroCaption"></div></div>
</div></section>

<section class="section" id="letter"><div class="wrap letter">
<div class="polaroid"><img src="assets/WhatsApp Image 2026-08-27 at 1.12.44 AM.jpeg" alt="Memory"><div class="small">One of the many moments that made us, us. ❤️</div></div>
<div class="letter-card"><div class="kicker" id="letterKicker"></div><p class="quote" id="letterQuote"></p><div class="letter-text" id="letterText"></div><div class="signature" id="signature"></div></div>
</div></section>

<section class="section" id="story"><div class="wrap"><div class="center"><div class="kicker">Our story</div><h2>A collection of little beginnings.</h2><p class="section-intro"></p></div><div class="timeline" id="timeline"></div></div></section>

<section class="section" id="memories"><div class="wrap"><div class="center"><div class="kicker">Our little archive</div><h2>Moments I never want to forget.</h2><p class="section-intro">A few snapshots from our very unofficial museum of us. Click any photo for a closer look.</p></div><div class="gallery" id="gallery"></div></div></section>

<section class="section note-section" id="surprise"><div class="note"><div class="kicker" id="surpriseKicker" style="color:#e7aaa1"></div><h2 id="surpriseTitle"></h2><p id="surpriseIntro"></p><button class="surprise" id="surpriseBtn"></button></div></section>
<footer class="footer"><div class="heart">♥</div><p id="footerText"></p></footer>

<div class="modal" id="modal"><div class="modal-box"><button class="close" id="close">×</button><div class="kicker" id="modalKicker"></div><h3 id="modalTitle"></h3><p id="modalText"></p></div></div>

<script>
const birthdayContent = {"hero": {"eyebrow": "A little something I made just for you", "titleLine1": "Happy Birthday,", "name": "Aarushiii.", "intro": "Maybe our story isn’t perfect, but that’s what makes it ours — every laugh, every adventure, every silly moment, and every memory.", "button": "Open my letter ♡", "heroCaption": "Two idiots, one picture, and somehow… a lifetime of stories. ❤️"}, "letter": {"kicker": "A letter for you", "quote": "For you, and everything we’ve become ❤️.", "paragraphs": ["Baby, Happy Birthday ❤️.", "I know we’ve come a long way, and these pictures are just a small part of everything we’ve been through together. We’ve seen our share of ups and downs, watched each other grow and change in so many ways, and somehow, through all of it, we’ve created so many memories that I’ll always keep close to my heart.", "Looking at these pictures honestly makes me realise how much we’ve experienced together. From the random and silly moments to the adventures, the laughs, the arguments, the crazy days, and all the little moments in between — every part of it has become a part of our story.", "And wherever life takes us from here, I just want you to know that I will always be here for you — annoying you a little, laughing with you a lot, going through the ups and downs together, and watching us grow through whatever comes next."], "signature": "Always by your side ❤️"}, "timeline": [{"date": "2019", "title": "The beginning", "text": "This is where our story started to change. ❤️", "image": "assets/memory-02.jpg"}, {"date": "Our first adventure", "title": "A memory worth keeping", "text": "Me: ‘Don’t go alone.’ You: go anyway. Me: ‘Fine, I’m coming too.’ 😂❤️", "image": "assets/memory-04.jpg"}, {"date": "One of my favourite days", "title": "Just us", "text": "One of those moments where we just lived, laughed, and made a memory.", "image": "assets/memory-05.jpg"}, {"date": "A little later...", "title": "More memories, more us", "text": "Your shopping partner, bag carrier, and your personal advisor. 🛍️😂", "image": "assets/WhatsApp Image 2026-08-27 at 1.24.27 AM.jpeg"}, {"date": "Today", "title": "Still choosing you", "text": "After all these memories, one thing hasn't changed: I still want more adventures with you. ❤️", "image": "assets/memory-11.jpeg"}], "memories": [{"image": "assets/WhatsApp Image 2026-08-27 at 3.51.36 AM.jpeg", "caption": "A little moment worth remembering. ❤️"}, {"image": "assets/WhatsApp Image 2026-08-27 at 1.41.46 AM.jpeg", "caption": "No matter what the world says, we’ll always be us. ❤️"}, {"image": "assets/memory-08.jpeg", "caption": "One of the many moments that made us, us. ❤️"}, {"image": "assets/WhatsApp Image 2026-08-27 at 1.12.32 AM.jpeg", "caption": "Just casually documenting our existence. As usual. 😂"}, {"image": "assets/memory-06.jpeg", "caption": "The kind of smile I could look at forever."}, {"image": "assets/memory-07.jpeg", "caption": "Just us being us."}, {"image": "assets/memory-09.jpg", "caption": "Sunsets are nicer when you're in the frame."}, {"image": "assets/memory-10.jpg", "caption": "My favourite kind of chaos."}], "surprise": {"kicker": "One more thing", "title": "There's a little surprise for you.", "intro": "I couldn't fit everything I want to say onto one page. So here's the short version: I love you, I'm proud of you, and I'm incredibly lucky that our paths crossed.", "button": "Open the secret message ♡", "modalKicker": "Okay, one last thing… ❤️", "modalTitle": "I'd choose you. Again.", "modalText": "No matter where we are or where life takes us, I just wanted to say I love you, and you’ll always be special to me. ❤️ And honestly, I’d still want the same thing — more late-night conversations, more trips, more photographs, more laughter, more silly moments, and more memories together. Happy Birthday, Aarushi. ❤️"}, "footer": "Love you ❤️😘"};

const c=birthdayContent;
document.getElementById('heroEyebrow').textContent=c.hero.eyebrow;
document.getElementById('heroTitle').textContent=c.hero.titleLine1;
document.getElementById('heroName').textContent=c.hero.name;
document.getElementById('heroIntro').textContent=c.hero.intro;
document.getElementById('heroButton').textContent=c.hero.button;
document.getElementById('heroCaption').textContent=c.hero.heroCaption;

document.getElementById('letterKicker').textContent=c.letter.kicker;
document.getElementById('letterQuote').textContent=c.letter.quote;
document.getElementById('letterText').innerHTML=c.letter.paragraphs.map(x=>'<p>'+x+'</p>').join('');
document.getElementById('signature').textContent=c.letter.signature;

document.getElementById('timeline').innerHTML=c.timeline.map(e=>`
  <article class="event">
    <div class="event-copy"><div class="event-date">${e.date}</div><h3>${e.title}</h3><p>${e.text}</p></div>
    <div class="event-photo"><img src="${e.image}" alt="${e.title}"></div>
  </article>`).join('');

document.getElementById('gallery').innerHTML=c.memories.map(m=>`
  <div class="card"><img src="${m.image}" alt="Memory"><div class="caption2">${m.caption}</div></div>`).join('');

document.getElementById('surpriseKicker').textContent=c.surprise.kicker;
document.getElementById('surpriseTitle').textContent=c.surprise.title;
document.getElementById('surpriseIntro').textContent=c.surprise.intro;
document.getElementById('surpriseBtn').textContent=c.surprise.button;
document.getElementById('modalKicker').textContent=c.surprise.modalKicker;
document.getElementById('modalTitle').textContent=c.surprise.modalTitle;
document.getElementById('modalText').textContent=c.surprise.modalText;
document.getElementById('footerText').textContent=c.footer;

const modal=document.getElementById('modal');
document.getElementById('surpriseBtn').onclick=()=>{
  modal.classList.add('show');
  for(let i=0;i<18;i++) setTimeout(()=>{
    const h=document.createElement('div');h.className='float-heart';h.textContent=['♥','♡','✦'][Math.floor(Math.random()*3)];
    h.style.left=(5+Math.random()*90)+'vw';h.style.fontSize=(14+Math.random()*18)+'px';document.body.appendChild(h);
    setTimeout(()=>h.remove(),5200);
  },i*80);
};
document.getElementById('close').onclick=()=>modal.classList.remove('show');
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
document.addEventListener('click',e=>{
  const img=e.target.closest('.card img'); if(!img)return;
  const overlay=document.createElement('div');overlay.className='modal show';
  overlay.innerHTML='<div class="modal-box" style="max-width:900px;padding:14px"><button class="close">×</button><img src="'+img.src+'" style="width:100%;max-height:80vh;object-fit:contain;border-radius:12px"></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('.close').onclick=()=>overlay.remove();
  overlay.onclick=x=>{if(x.target===overlay)overlay.remove()};
});
</script>
</body>
</html>
